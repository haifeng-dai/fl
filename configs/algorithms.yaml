    lr_alpha: 0.1
    prune_round: 20
    prune_num: 0

dispfl:
    dense_ratio: 0.5
    anneal_factor: 1.0

pearfl:
    lamda: 0.1

dfedpgp:
    local_v_epochs: 1
    lr_v: 0.01
    momentum_v: 0.0
    weight_decay_v: 0.0

proxyfl:
    mu: 0.01

dfedup:
    mu: 1.0
    temp: 1

dfedup1:
    mu: 0.1

dfedup2:
    mu: 1.0
