# 算法专属配置 (Algorithm Specific Arguments)

fedprox:
    mu: 0.01

scaffold:
    global_lr: 1.0

feddyn:
    alpha_coef: 0.1

fedpln:
    lambda_: 10.0
    epoch_pln: 10
    lr_pln: 0.01
    batch_size_pln: 64
    depth_pln: 1
    width_pln: 512
    mode: normal
    fixed_proto: 0
    init_emb: 0
    har: 0

fedfm:
    mu: 0.1

moon:
    mu: 0.01
    tau: 0.5

fedlsa:
    lambda_com: 0.1
    alpha_sep: 0.1
    server_epochs: 10
    server_lr: 0.01
    tau: 0.1

fedrep:
    epochs_head: 5

fedproto:
    mu: 1.0

fedala:
    eta: 1.0
    rand_percent: 20
    layer_idx: 1
    ala_threshold: 0.1
    num_pre_loss: 10

fedtgp:
    lamda_: 10.0
    server_epochs: 10
    server_lr: 0.01
    margin_threshold: 1.0

feddpc:
    lamda_: 100.0
    lambda_p: 1.0
    lambda_acl: 0.01
