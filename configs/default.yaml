# 全局默认配置 (Global Defaults)

# 数据相关 (Data)
dataset: # cifar10, cifar100, cinic10, tiny_imagenet, mnist, fashionmnist, emnist
    - cifar10
    # - cifar100
    # - cinic10
    # - tiny_imagenet
model:
    - cnn
    # - resnet18
feature_dim: 512
num_clients:
    - 20
    # - 100
partition:
    - dirichlet
    # - pathological
alpha: 0.1
n_class: 0 # 0 表示自动根据数据集选择
test_ratio: 0.2

# 训练相关 (Training)
rounds: 1000 # pFL: 500, gFL: 1000, 0 表示自动调整
epochs: 1
lr: 0.01
momentum: 0.0
weight_decay: 0.0
batch_size: 64
join_ratio: 1.0
seed: 42
times: 5

# 资源与框架 (Resources & Ray)
gpus: "0,1,2,3" # 使用的物理 GPU 编号，逗号分隔
# gpus: "0,1"
# gpus: "2,3"
# gpus: "2,0"
max_workers_per_gpu: 5
test: 0 # 是否开启测试模式 (1: 开启, 0: 关闭)，可用 -t 在命令行中快速开启

# 去中心化网络拓扑 (Network Topology)
# ring, complete, random, small_world, scale_free, star
adj_type: ring
edge_p: 0.0 # random / small_world
k_small_world: # small_world
    - 2
    # - 4
    # - 6
    # - 8
    # - 10
    # - 12
    # - 14
    # - 16
    # - 18
m_scale_free: # scale_free
    - 2
    # - 4
    # - 6
    # - 8
    # - 10
    # - 12
    # - 14
    # - 16
    # - 18
