# 全局默认配置 (Global Defaults)

# 数据相关 (Data)
dataset: # cifar10, cifar100, cinic10, tiny_imagenet, mnist, fashionmnist, emnist
    - cifar10
    # - cifar100
    # - cinic10
    # - tiny_imagenet
model:
    - cnn
    # - resnet18
feature_dim: 512
num_clients:
    - 20
    # - 100
partition:
    - dirichlet
    # - pathological
alpha:
    - 0.1
    # - 0.5
n_class: 0 # 0 表示自动根据数据集选择
test_ratio: 0.2

# 训练相关 (Training)
rounds: 1000 # pFL: 500, gFL: 1000, 0 表示自动调整
epochs: 1
lr: 0.01
momentum: 0.0
weight_decay: 0.0
batch_size: 64
join_ratio: 1.0
seed: 42
times: 5

# 资源与框架 (Resources & Ray)
# gpus: "0,1,2,3" # 使用的物理 GPU 编号，逗号分隔
# gpus: "0,1"
# gpus: "2,3"
gpus: "3,1,2"
max_workers_per_gpu: 5
test: 0 # 是否开启测试模式 (1: 开启, 0: 关闭)，可用 -t 在命令行中快速开启

# 领域与半监督参数
# ── 组合模式 ──────────────────────────────────────────────
#  传统 FL:        domain_partition=~, label_ratio=1.0
#  通用半监督:     domain_partition=~, label_ratio=0.x, lam=x
#  DG:             domain_partition=domain_*, label_ratio=1.0
#  DG+通用半监督:  domain_partition=domain_*, label_ratio=0.x, lam=x
#  DG+域掩半监督:  domain_partition=domain_*, unlabeled_domain=X, lam=x
#  DG+两者叠加:    domain_partition=domain_*, unlabeled_domain=X, label_ratio=0.x
#  留一域评估:     domain_partition=domain_*, target_domain=X, label_ratio=1.0
# ──────────────────────────────────────────────────────────
domain_partition: ~ # ~ / domain_as_client / domain_mixed_aware / domain_mixed_blind
selected_domains: ~ # list[str]，仅使用指定域；None=全用。与 target_domain 互斥。
target_domain: ~ # str，从训练集剥离作为目标域（leave-one-domain-out），与 selected_domains 互斥。
unlabeled_domain: ~ # str，将该域的标签全部掩掉以构造半监督场景。仅 domain_partition 非空时生效。
label_ratio: 1.0 # float (0~1]，通用半监督中有标签样本比例。1.0 = 全监督。
lam: 1.0 # float，无监督损失权重系数。0 = 退化为纯监督。

# 去中心化网络拓扑 (Network Topology)
# ring, complete, random, small_world, scale_free, star
adj_type: ring
edge_p: 0.0 # random / small_world
k_small_world: # small_world
    - 2
    # - 4
    # - 6
    # - 8
    # - 10
    # - 12
    # - 14
    # - 16
    # - 18
m_scale_free: # scale_free
    - 2
    # - 4
    # - 6
    # - 8
    # - 10
    # - 12
    # - 14
    # - 16
    # - 18
