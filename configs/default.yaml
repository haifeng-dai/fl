# 全局默认配置 (Global Defaults)

# 数据相关 (Data)
dataset: # cifar10, cifar100, cinic10, tiny_imagenet, mnist, fashionmnist, emnist
    # - cifar10
    # - cifar100
    # - cinic10
    # - tiny_imagenet
    # - mnist
    # - fashionmnist
    # - emnist
    - cifar10_dg
model:
    - cnn
    # - resnet18
feature_dim: 512
num_clients:
    # - 10
    - 20
    # - 100
partition:
    - dirichlet
    # - pathological
    # - iid
alpha: 0.1 # dirichlet 异质性强度；类别划分下控制客户端类分布，FDG/SFD 模式下同时控制「每个域内部」的类分布异质
n_class: 0 # 0 表示自动根据数据集选择
test_ratio: 0.2 # FDG 下源域 test_ratio=0（不留存源域测试集，目标域整体打散进各客户端 test）；仅对 SFD / 类别划分生效

# ── 维度一：数据划分（partition 布尔开关）────────────────────────────
# 不适用数据分布异质性
# FDG（Federated Domain Generalization）：源域全部作为训练集，目标域整体作为测试集。
#   源域不保留测试集（test_ratio 对源域无效）；目标域样本均分打散到各客户端 test
#   （不参与训练），评估时合并全局测试集即全目标域样本；二值互斥。
fdg: false # true=开启域泛化 FDG；false/缺省=类别划分
selected_domains: "clean,rotate_cutout" # 逗号分隔字符串，参与划分的域集合，仅 FDG 模式生效。
#   FDG 下「源域」= selected_domains 中除 target_domain 外的域（全部用于训练）；
#   「目标域」= target_domain（样本均分进各客户端 test，不进入训练）。
target_domain: rotate_cutout # str，仅 FDG 模式生效：该域为测试

# ── 维度二：半监督策略（ssl）─────────────────────────────────────────
# 适用数据分布异质性
#  none    : 全监督
#  sample  : 场景B——每客户端同时含标签+未标签，按 label_ratio 比例掩码每客户端内样本（同分布）。仅类别划分。
#  client  : 场景A——部分客户端全标签、其余全无标签，按 label_ratio 选有标签客户端（同分布）。仅类别划分。
#  sfd     : SFD 双域半监督场景（源域按 label_rate 保留标签 + 目标域全无标签）。
ssl: sfd # none | sample | client | sfd
label_ratio: 0.5 # float (0~1]，统一适用于 sample / client / sfd 场景的有标签数据比例
lam: 1.0 # float，fedtest 无监督损失权重；0 = 退化为纯监督。
confidence: 0.5 # float，fedtest FixMatch 伪标签置信度阈值。
# SFD 专属配置（当 ssl: sfd 时生效）
label_domain: clean # str，指定有标签源域。
unlabel_domain: rotate_cutout # str，指定无标签目标域。

# 训练相关 (Training)
rounds: 0 # pFL: 1000, gFL: 200, 0 表示自动调整
epochs: 1
lr: 0.01
momentum: 0.0
weight_decay: 0.0
batch_size: 64
join_ratio: 1.0
seed: 42
times: 1

# 资源与框架 (Resources & Ray)
gpus: "0,1,2,3" # 使用的物理 GPU 编号，逗号分隔
# gpus: "0,1"
# gpus: "2,3"
# gpus: "0,1,3"
max_workers_per_gpu: 5
test: 0 # 是否开启测试模式 (1: 开启, 0: 关闭)，可用 -t 在命令行中快速开启

# 去中心化网络拓扑 (Network Topology)
# ring, complete, random, small_world, scale_free, star
adj_type: ring
edge_p: 0.0 # random / small_world
k_small_world: # small_world
    - 2
    # - 4
    # - 6
    # - 8
    # - 10
    # - 12
    # - 14
    # - 16
    # - 18
m_scale_free: # scale_free
    - 2
    # - 4
    # - 6
    # - 8
    # - 10
    # - 12
    # - 14
    # - 16
    # - 18
