[project]
name = "fl"
version = "0.1.0"
description = "A Federated Learning Framework powered by Ray"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "kagglehub>=1.0.0",
    "matplotlib>=3.10.8",
    "networkx>=3.6.1",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "pyyaml>=6.0.3",
    "ray>=2.54.1",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.37.3",
    "black>=25.12.0",
    "ipykernel>=7.2.0",
    "notebook>=7.5.4",
    "ruff>=0.15.11",
    "ty>=0.0.15",
]

[tool.basedpyright]
typeCheckingMode = "standard"
reportPrivateImportUsage = false
reportPrivateLocalImportUsage = false
reportUnknownVariableType = false
reportOptionalMemberAccess = false
reportOptionalCall = false
reportArgumentType = false
reportAttributeAccessIssue = false
reportIncompatibleMethodOverride = false
reportCallIssue = false

[tool.uv]
managed = true

[[tool.uv.index]]
name = "pypi"
url = "https://mirror.nju.edu.cn/pypi/web/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu130/"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
